<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Ticker</title>
    <link rel="stylesheet" href="css/standard.css">
    <style>
        @font-face {
            font-family: 'AgencyFB';
            src: url('fonts/agency_fb.ttf') format('truetype');
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'AgencyFB', sans-serif;
            color: white;
            background: transparent;
        }

        /* ===== CONTAINER ===== */
        #container {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #container.show {
            opacity: 1;
        }

        /* ===== SCOREBOARD PANEL ===== */
        .scoreboard {
            position: absolute;
            right: 40px;
            top: 20px;
            width: 440px;
            max-height: calc(1080px - 40px);
            overflow: hidden;
            background: linear-gradient(180deg, #0D0D0D 0%, #121212 100%);
            border: 2px solid #C89B3C;
            box-shadow: 0 0 30px rgba(200, 155, 60, 0.35),
                inset 0 0 20px rgba(0, 0, 0, 0.6);
            /* Slide-in from right */
            transform: translateX(520px);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        #container.show .scoreboard {
            transform: translateX(0);
        }

        /* ===== HEADER ===== */
        .panel-header {
            background: linear-gradient(90deg, #8B6914 0%, #C89B3C 30%, #F0C040 50%, #C89B3C 70%, #8B6914 100%);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .panel-header-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #1A1A1A;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.2);
        }

        .panel-header-badge {
            font-size: 13px;
            letter-spacing: 2px;
            color: #1A1A1A;
            font-weight: bold;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* ===== TABLE COLUMN HEADER ===== */
        .table-col-header {
            display: grid;
            grid-template-columns: 44px 1fr 46px 70px 44px;
            align-items: center;
            background: #1A1A1A;
            border-bottom: 1px solid rgba(200, 155, 60, 0.4);
            padding: 5px 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #C89B3C;
            text-transform: uppercase;
        }

        /* ===== TEAM LIST ===== */
        .team-list {
            display: flex;
            flex-direction: column;
        }

        .team-row {
            display: grid;
            grid-template-columns: 44px 1fr 46px 70px 44px;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 10px;
            min-height: 44px;
            /* Stagger slide-in */
            opacity: 0;
            transform: translateX(40px);
            transition: opacity 0.45s ease, transform 0.45s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        #container.show .team-row {
            opacity: 1;
            transform: translateX(0);
        }

        .team-row:nth-child(odd) {
            background: rgba(26, 26, 26, 0.85);
        }

        .team-row:nth-child(even) {
            background: rgba(20, 20, 20, 0.75);
        }

        /* Dead row styling */
        .team-row.is-dead .col-team-inner {
            color: #555;
        }

        .team-row.is-dead .team-logo {
            filter: grayscale(1);
            opacity: 0.35;
        }

        .team-row.is-dead .col-rank-val {
            color: #444;
        }

        /* ===== COLUMNS ===== */
        .col-rank-val {
            text-align: center;
            font-size: 16px;
            color: #C89B3C;
            font-weight: bold;
        }

        .col-team-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            padding-left: 4px;
        }

        .team-logo {
            width: 20px;
            height: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 1px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        .team-name-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 19px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .col-pts-val {
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            color: #FFFFFF;
        }

        /* ===== ALIVE BARS ===== */
        .col-alive-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .alive-bar {
            width: 10px;
            height: 22px;
            border-radius: 3px;
        }

        .alive-bar.W {
            background: #3DBA4E;
            box-shadow: 0 0 5px rgba(61, 186, 78, 0.7);
        }

        .alive-bar.D {
            background: #2A2A2A;
            border: 1px solid #3A3A3A;
        }

        .alive-bar.R {
            background: #E04040;
            box-shadow: 0 0 5px rgba(224, 64, 64, 0.7);
        }

        .miss-text {
            color: #555;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .col-elims-val {
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            color: #F0C040;
        }

        /* ===== GOLD DIVIDER LINE ===== */
        .gold-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #C89B3C 30%, #F0C040 50%, #C89B3C 70%, transparent 100%);
            opacity: 0.6;
        }

        /* ===== STAGGERED ANIMATION DELAYS ===== */
        .team-list .team-row:nth-child(1) {
            transition-delay: 0.08s;
        }

        .team-list .team-row:nth-child(2) {
            transition-delay: 0.13s;
        }

        .team-list .team-row:nth-child(3) {
            transition-delay: 0.18s;
        }

        .team-list .team-row:nth-child(4) {
            transition-delay: 0.23s;
        }

        .team-list .team-row:nth-child(5) {
            transition-delay: 0.28s;
        }

        .team-list .team-row:nth-child(6) {
            transition-delay: 0.33s;
        }

        .team-list .team-row:nth-child(7) {
            transition-delay: 0.38s;
        }

        .team-list .team-row:nth-child(8) {
            transition-delay: 0.43s;
        }

        .team-list .team-row:nth-child(9) {
            transition-delay: 0.48s;
        }

        .team-list .team-row:nth-child(10) {
            transition-delay: 0.53s;
        }

        .team-list .team-row:nth-child(11) {
            transition-delay: 0.58s;
        }

        .team-list .team-row:nth-child(12) {
            transition-delay: 0.63s;
        }

        .team-list .team-row:nth-child(13) {
            transition-delay: 0.68s;
        }

        .team-list .team-row:nth-child(14) {
            transition-delay: 0.73s;
        }

        .team-list .team-row:nth-child(15) {
            transition-delay: 0.78s;
        }

        .team-list .team-row:nth-child(16) {
            transition-delay: 0.83s;
        }

        .team-list .team-row:nth-child(17) {
            transition-delay: 0.88s;
        }

        .team-list .team-row:nth-child(18) {
            transition-delay: 0.93s;
        }

        .team-list .team-row:nth-child(19) {
            transition-delay: 0.98s;
        }

        .team-list .team-row:nth-child(20) {
            transition-delay: 1.03s;
        }
    </style>
</head>

<body>

    <div id="container">
        <div class="scoreboard">
            <!-- Header -->
            <div class="panel-header">
                <div class="panel-header-title">Live Ranking</div>
                <div class="panel-header-badge">PIALA WALIKOTA</div>
            </div>
            <div class="gold-divider"></div>

            <!-- Column labels -->
            <div class="table-col-header">
                <div style="text-align:center">#</div>
                <div style="padding-left:4px">TEAM</div>
                <div style="text-align:center">PTS</div>
                <div style="text-align:center">ALIVE</div>
                <div style="text-align:center">ELIM</div>
            </div>

            <!-- Rows injected by JS -->
            <div class="team-list" id="team-list"></div>
        </div>
    </div>

    <script>
        function generateRows(count) {
            const list = document.getElementById('team-list');
            if (!list) return;

            while (list.children.length < count) {
                let i = list.children.length + 1;
                let div = document.createElement("div");
                div.className = "team-row";
                div.id = `row_${i}`;
                div.innerHTML = `
                <div class="col-rank-val" id="f_rank_${i}">#${i}</div>
                <div class="col-team-cell">
                    <img class="team-logo" src="images/flag_indo.png" onerror="this.style.display='none'">
                    <span class="team-name-text col-team-inner" id="f_team_${i}">Team ${i}</span>
                </div>
                <div class="col-pts-val" id="f_pts_${i}">0</div>
                <div class="col-alive-cell" id="f_alive_${i}"></div>
                <div class="col-elims-val" id="f_elims_${i}">0</div>
            `;
                list.appendChild(div);
            }
            while (list.children.length > count) {
                list.removeChild(list.lastChild);
            }
        }

        function getPlacementPts(rank) {
            const table = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1];
            const r = parseInt(rank);
            if (r >= 1 && r <= 10) return table[r - 1];
            return 0;
        }
        function renderAlivePills(val, containerId) {
            let el = document.getElementById(containerId);
            if (!el) return;

            val = String(val).toUpperCase().trim();
            let html = '';
            if (val === 'MISS' || val === 'MISSED') {
                html = '<span class="miss-text">MISS</span>';
            } else {
                for (let i = 0; i < 4; i++) {
                    let char = val.charAt(i) || 'D';
                    if (char === 'W' || char === 'R' || char === 'D') {
                        html += `<div class="alive-bar ${char}"></div>`;
                    } else {
                        html += `<div class="alive-bar D"></div>`;
                    }
                }
            }
            if (el.innerHTML !== html) el.innerHTML = html;
        }

        function play() { document.getElementById('container').classList.add('show'); }
        function stop() { document.getElementById('container').classList.remove('show'); }

        function update(str) {
            try {
                var data = typeof str === 'string' ? JSON.parse(str) : str;
                for (var key in data) {
                    var val = data[key];
                    if (val && typeof val === 'object' && val.v !== undefined) { val = val.v; }

                    if (key.startsWith('f_alive_')) {
                        renderAlivePills(val, key);
                    } else {
                        var el = document.getElementById(key);
                        if (el && el.textContent !== String(val)) { el.textContent = val; }
                    }
                }
            } catch (e) { console.error("Update Error: ", e); }
        }

        function processState(state) {
            if (state && state.teams) {
                // Urutkan teams berdasarkan (Kill saat ini + Total Point dari Overall)
                const sortedTeams = [...state.teams].map(t => {
                    let overall_pts = 0;
                    if (state.overall_ranking) {
                        const ot = state.overall_ranking.find(o => o.name === t.name);
                        if (ot) overall_pts = ot.total; // Ambil Total Point dari OVERALL RANKING
                    }
                    const total_pts = (t.kills || 0) + overall_pts;
                    return { ...t, overall_pts, total_pts };
                }).sort((a, b) => b.total_pts - a.total_pts || b.kills - a.kills);

                const count = sortedTeams.length;
                generateRows(count);
                let newData = {};

                sortedTeams.forEach((t, i) => {
                    let teamIndex = i + 1;
                    newData[`f_team_${teamIndex}`] = t.name;
                    newData[`f_elims_${teamIndex}`] = t.kills;
                    newData[`f_pts_${teamIndex}`] = t.overall_pts; // Menampilkan murni Total Point Overall
                    newData[`f_rank_${teamIndex}`] = `#${teamIndex}`; // Menampilkan posisi saat ini

                    let aliveStr = "";
                    if (t.status === "MISS" || t.alive === 0) aliveStr = "DDDD";
                    else if (t.alive === 4) aliveStr = "WWWW";
                    else if (t.alive === 3) aliveStr = "WWWD";
                    else if (t.alive === 2) aliveStr = "WWDD";
                    else if (t.alive === 1) aliveStr = "WDDD";

                    newData[`f_alive_${teamIndex}`] = aliveStr;
                    const row = document.getElementById(`row_${teamIndex}`);
                    if (row) row.classList.toggle("is-dead", t.status === "DEAD" || t.alive === 0);
                });
                update(newData);
            }
        }

        // ==============================================================================
        // INTEGRASI GOOGLE APPS SCRIPT BACKEND (AUTO-POLLING)
        // ==============================================================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwZ15aIzh3YXL2BC0BGEcnlikWG2T40WPVUPRHD_Vl3GtPUmPJvnU4ayrVSlokvs--l/exec";

        let previousMatchState = [];
        let isFetching = false;
        let hasPlayed = false;

        function fetchFromGoogleSheets() {
            if (isFetching) return;
            isFetching = true;

            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    let state = {};

                    // 1. Deteksi jika halaman ini adalah OVERALL RANKING
                    if (document.getElementById("f_overall_title")) {
                        state.teams = data.overall_ranking;
                        if (typeof processState === "function") processState(state);
                    }

                    // 2. Deteksi jika halaman ini adalah ELIMINATED OVERLAY
                    else if (document.querySelector(".eliminated-card")) {
                        const currentMatch = data.match_ranking;

                        // Deteksi tim yang baru saja "Mati" (Rata Lobi)
                        if (previousMatchState.length > 0) {
                            currentMatch.forEach(team => {
                                const prevTeam = previousMatchState.find(p => p.name === team.name);
                                // Jika sebelumnya Alive (angkanya > 0) dan sekarang Alive menjadi 0
                                if (prevTeam && prevTeam.alive > 0 && team.alive === 0) {
                                    state.eliminated_trigger = {
                                        timestamp: Date.now(),
                                        team_name: team.name,
                                        team_id: team.id,
                                        kills: team.kills,
                                        rank: team.rank // Menangkap rank yang dikirim dari backend
                                    };
                                    if (typeof checkState === "function") checkState(state);
                                }
                            });
                        }
                        previousMatchState = currentMatch;
                    }

                    // 3. Deteksi jika halaman ini adalah LIVE TICKER atau MATCH RANKING
                    else {
                        state.postmatch = data.postmatch;
                        state.teams = data.match_ranking;
                        state.overall_ranking = data.overall_ranking; // Ambil overall ranking
                        if (typeof processState === "function") processState(state);
                    }

                    // Tampilkan animasi masuk hanya SETELAH data pertama kali berhasil dirender
                    if (!hasPlayed) {
                        setTimeout(() => play(), 100);
                        hasPlayed = true;
                    }

                    isFetching = false;
                })
                .catch(err => {
                    console.error("Gagal mengambil data dari Google Sheets:", err);
                    isFetching = false;
                });
        }

        // Jalankan pengambilan data pertama kali saat halaman dimuat
        fetchFromGoogleSheets();

        // Lakukan Polling (Tarik Data) setiap 2 detik
        setInterval(fetchFromGoogleSheets, 2000);

        // Dengarkan perubahan dari Dashboard (Local Storage) untuk update instan
        window.addEventListener("storage", function (e) {
            if (e.key === "pubgm_overlay_state" && e.newValue) {
                try {
                    let state = JSON.parse(e.newValue);
                    if (typeof processState === "function") processState(state);
                } catch (err) { console.error("Storage parse error", err); }
            }
        });
    </script>
</body>

</html>
