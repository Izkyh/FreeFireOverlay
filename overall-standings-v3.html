<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Overall Standings</title>
    <link rel="stylesheet" href="css/standard.css" />
    <style>
      @font-face {
        font-family: "AgencyFB";
        src: url("fonts/agency_fb.ttf") format("truetype");
      }

      body, html {
        margin: 0; padding: 0;
        width: 1080px; height: 1080px;
        overflow: hidden;
        font-family: "AgencyFB", sans-serif;
        color: white;
        background: transparent;
      }

      /* === FULL CANVAS (transparent by default) === */
      #container {
        width: 1080px; height: 1080px;
        position: absolute; top: 0; left: 0;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      #container.show { opacity: 1; }

      /* === 1080x1080 CONTENT AREA === */
      .content-area {
        width: 1080px;
        height: 1080px;
        background: linear-gradient(180deg, #080808 0%, #101010 60%, #0C0C0C 100%);
        display: flex;
        flex-direction: column;
        padding: 22px 22px 18px;
        box-sizing: border-box;
        gap: 10px;
      }

      /* ===== HEADER BAR ===== */
      .header-bar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-shrink: 0;
        opacity: 0;
        transform: translateY(-14px);
        transition: all 0.55s ease;
      }
      #container.show .header-bar {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.05s;
      }

      .title-left { display: flex; flex-direction: column; gap: 1px; }
      .title-eyebrow {
        font-size: 12px;
        letter-spacing: 7px;
        color: #C89B3C;
        text-transform: uppercase;
        font-weight: bold;
      }
      .title-main {
        font-size: 54px;
        font-weight: bold;
        letter-spacing: 3px;
        line-height: 0.9;
        background: linear-gradient(180deg, #F5D56A 0%, #C89B3C 45%, #F0C868 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 8px rgba(200,155,60,0.5));
      }

      .match-info {
        display: flex; flex-direction: column; align-items: flex-end;
      }
      .match-label {
        font-size: 12px; letter-spacing: 4px; color: #888; text-transform: uppercase;
      }
      .match-value {
        font-size: 28px; font-weight: bold; color: #fff; letter-spacing: 1px;
      }
      .match-value span { color: #F0C040; }

      /* ===== GOLD DIVIDER ===== */
      .gold-line {
        height: 2px; flex-shrink: 0;
        background: linear-gradient(90deg, transparent, #8B6914 10%, #F0C040 50%, #8B6914 90%, transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #container.show .gold-line { opacity: 1; transition-delay: 0.15s; }

      /* ===== COLUMN LABELS ===== */
      .col-labels-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex-shrink: 0;
        opacity: 0; transform: translateX(-18px);
        transition: all 0.45s ease;
      }
      #container.show .col-labels-row {
        opacity: 1; transform: translateX(0);
        transition-delay: 0.18s;
      }
      .col-label-block {
        display: grid;
        grid-template-columns: 46px 1fr 84px 72px 84px;
        font-size: 11px; letter-spacing: 2px;
        color: #C89B3C; text-transform: uppercase; font-weight: bold;
        padding: 3px 8px;
        border-bottom: 1px solid rgba(200,155,60,0.4);
      }
      .col-label-block > div { text-align: center; }
      .col-label-block > div:nth-child(2) { text-align: left; padding-left: 6px; }

      /* ===== 2-COLUMN TABLE GRID ===== */
      .tables-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1;
        min-height: 0;
      }

      .team-column {
        display: flex; flex-direction: column; gap: 5px;
      }

      /* ===== TEAM ROW ===== */
      .team-row {
        display: grid;
        grid-template-columns: 46px 1fr 84px 72px 84px;
        align-items: center;
        font-size: 18px; font-weight: bold;
        min-height: 52px;
        padding: 6px 8px;
        box-sizing: border-box;
        background: linear-gradient(90deg, #181818 0%, #1F1F1F 50%, #181818 100%);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 3px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        opacity: 0; transform: translateY(14px);
        transition: opacity 0.42s ease, transform 0.42s ease;
      }
      #container.show .team-row { opacity: 1; transform: translateY(0); }

      /* Rank-1 (top of left column) — gold */
      .team-column:first-child .team-row:first-child {
        background: linear-gradient(90deg, #231A04 0%, #3B2B06 40%, #4A3508 50%, #3B2B06 60%, #231A04 100%);
        border-color: rgba(200,155,60,0.6);
        box-shadow: 0 0 18px rgba(200,155,60,0.22), 0 2px 8px rgba(0,0,0,0.5);
      }
      .team-column:first-child .team-row:first-child .r-rank { color: #F0C040; font-size: 20px; }
      .team-column:first-child .team-row:first-child .r-total { color: #F0C040; font-size: 21px; }

      /* ===== CELLS ===== */
      .r-rank { text-align: center; color: #C89B3C; font-size: 16px; font-weight: bold; }

      .r-team {
        display: flex; align-items: center; gap: 8px;
        overflow: hidden; padding-left: 6px;
      }
      .team-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
      .team-name-text {
        font-size: 17px; text-transform: uppercase;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        letter-spacing: 0.5px;
      }

      .r-plc, .r-kp, .r-total {
        text-align: center; position: relative;
      }
      .r-plc::before, .r-kp::before, .r-total::before {
        content: "";
        position: absolute; left: 0; top: 20%; height: 60%;
        width: 1px; background: rgba(200,155,60,0.22);
      }
      .r-plc  { color: #CCCCCC; font-size: 17px; }
      .r-kp   { color: #F0C040; font-size: 17px; }
      .r-total { color: #FFFFFF; font-size: 19px; font-weight: bold; }

      /* ===== STAGGER ===== */
      .team-column:nth-child(1) .team-row:nth-child(1) { transition-delay: 0.20s; }
      .team-column:nth-child(1) .team-row:nth-child(2) { transition-delay: 0.24s; }
      .team-column:nth-child(1) .team-row:nth-child(3) { transition-delay: 0.28s; }
      .team-column:nth-child(1) .team-row:nth-child(4) { transition-delay: 0.32s; }
      .team-column:nth-child(1) .team-row:nth-child(5) { transition-delay: 0.36s; }
      .team-column:nth-child(1) .team-row:nth-child(6) { transition-delay: 0.40s; }
      .team-column:nth-child(1) .team-row:nth-child(7) { transition-delay: 0.44s; }
      .team-column:nth-child(1) .team-row:nth-child(8) { transition-delay: 0.48s; }
      .team-column:nth-child(2) .team-row:nth-child(1) { transition-delay: 0.26s; }
      .team-column:nth-child(2) .team-row:nth-child(2) { transition-delay: 0.30s; }
      .team-column:nth-child(2) .team-row:nth-child(3) { transition-delay: 0.34s; }
      .team-column:nth-child(2) .team-row:nth-child(4) { transition-delay: 0.38s; }
      .team-column:nth-child(2) .team-row:nth-child(5) { transition-delay: 0.42s; }
      .team-column:nth-child(2) .team-row:nth-child(6) { transition-delay: 0.46s; }
      .team-column:nth-child(2) .team-row:nth-child(7) { transition-delay: 0.50s; }
      .team-column:nth-child(2) .team-row:nth-child(8) { transition-delay: 0.54s; }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="content-area">

        <!-- HEADER -->
        <div class="header-bar">
          <div class="title-left">
            <div class="title-eyebrow">Piala Walikota · PUBG Mobile</div>
            <div class="title-main" id="f_overall_title">OVERALL RANKINGS</div>
          </div>
          <div class="match-info">
            <div class="match-label">POST MATCH</div>
            <div class="match-value">
              DAY <span id="f_day">1</span> · M<span id="f_post_match">—</span>
            </div>
          </div>
        </div>

        <!-- GOLD LINE -->
        <div class="gold-line"></div>

        <!-- COLUMN LABELS -->
        <div class="col-labels-row">
          <div class="col-label-block">
            <div>#</div><div>TEAM</div><div>PLCS PTS</div><div>KP</div><div>TOTAL</div>
          </div>
          <div class="col-label-block">
            <div>#</div><div>TEAM</div><div>PLCS PTS</div><div>KP</div><div>TOTAL</div>
          </div>
        </div>

        <!-- 2-COLUMN TABLE -->
        <div class="tables-grid">
          <div class="team-column" id="col-left"></div>
          <div class="team-column" id="col-right"></div>
        </div>

      </div>
    </div>

    <script>
      const PLACEMENT_PTS = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1];
      function getPlacementPts(rank) {
        if (rank >= 1 && rank <= 10) return PLACEMENT_PTS[rank - 1];
        return 0;
      }

      function buildRow(t, pos) {
        const plc = t.place_pts !== undefined ? t.place_pts : 0;
        const kp  = t.kill_pts  !== undefined ? t.kill_pts  : 0;
        const tot = t.total     !== undefined ? t.total     : 0;
        const logoId = t.id || pos;
        return `
          <div class="team-row">
            <div class="r-rank">#${pos}</div>
            <div class="r-team">
              <img class="team-logo" src="team_logos/${logoId}.png" onerror="this.style.display='none'">
              <span class="team-name-text">${t.name || ('TEAM ' + pos)}</span>
            </div>
            <div class="r-plc">${plc}</div>
            <div class="r-kp">${kp}</div>
            <div class="r-total">${tot}</div>
          </div>`;
      }

      function play() { document.getElementById("container").classList.add("show"); }
      function stop() { document.getElementById("container").classList.remove("show"); }

      function update(str) {
        try {
          var data = typeof str === "string" ? JSON.parse(str) : str;
          for (var key in data) {
            var val = data[key];
            if (val && typeof val === "object" && val.v !== undefined) val = val.v;
            var el = document.getElementById(key);
            if (el) el.innerHTML = val;
          }
        } catch (e) { console.error("Update Error:", e); }
      }

      function renderTeams(sorted) {
        const colLeft  = document.getElementById("col-left");
        const colRight = document.getElementById("col-right");
        colLeft.innerHTML  = "";
        colRight.innerHTML = "";
        sorted.forEach((t, i) => {
          const pos = i + 1;
          if (pos <= 8) colLeft.innerHTML  += buildRow(t, pos);
          else          colRight.innerHTML += buildRow(t, pos);
        });
      }

      function processState(state) {
        if (!state || !state.teams) return;
        const sorted = state.teams
          .filter(t => t.status !== "MISS")
          .map(t => {
            const place_pts = t.place_pts !== undefined ? t.place_pts : getPlacementPts(t.rank);
            const kill_pts  = t.kill_pts  !== undefined ? t.kill_pts  : t.kills;
            const total     = t.total     !== undefined ? t.total     : place_pts + kill_pts;
            return { ...t, place_pts, kill_pts, total };
          })
          .sort((a, b) =>
            b.total - a.total ||
            (b.wwcd || 0) - (a.wwcd || 0) ||
            b.kill_pts - a.kill_pts
          )
          .slice(0, 16);
        renderTeams(sorted);
      }

      // Placeholder on load
      (function generatePlaceholders() {
        const left = document.getElementById("col-left");
        const right = document.getElementById("col-right");
        left.innerHTML = right.innerHTML = "";
        for (let i = 1; i <= 8; i++) {
          left.innerHTML  += buildRow({ id: i,   name: "TEAM " + i,      place_pts: 0, kill_pts: 0, total: 0 }, i);
          right.innerHTML += buildRow({ id: i+8, name: "TEAM " + (i+8), place_pts: 0, kill_pts: 0, total: 0 }, i+8);
        }
      })();

      setTimeout(() => play(), 500);

      fetch("http://localhost:3000/api/state")
        .then(r => r.json())
        .then(state => processState(state))
        .catch(() => {});

      const evtSource = new EventSource("http://localhost:3000/api/stream");
      evtSource.onmessage = (event) => {
        try { processState(JSON.parse(event.data)); } catch(e) {}
      };
    </script>
  </body>
</html>
