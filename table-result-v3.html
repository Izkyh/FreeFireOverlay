<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match Ranking</title>
    <style>
      @font-face {
        font-family: "AgencyFB";
        src: url("fonts/agency_fb.ttf") format("truetype");
      }
      body, html {
        margin: 0; padding: 0;
        width: 1080px; height: 1080px;
        overflow: hidden;
        font-family: "AgencyFB", sans-serif;
        color: white;
        background: transparent;
      }

      /* === FULL CANVAS === */
      #container {
        width: 1080px; height: 1080px;
        position: absolute; top: 0; left: 0;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      #container.show { opacity: 1; }

      /* === 1080x1080 CONTENT AREA === */
      .content-area {
        width: 1080px;
        height: 1080px;
        display: flex;
        align-items: stretch;
        overflow: hidden;
      }

      /* ===== LEFT: BRANDING PANEL (280px) ===== */
      .brand-panel {
        flex: 0 0 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #080808 0%, #0F0F0F 100%);
        border-right: 2px solid rgba(200,155,60,0.4);
        padding: 32px 20px;
        box-sizing: border-box;
        gap: 0;
        transform: translateX(-40px);
        opacity: 0;
        transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s ease;
      }
      #container.show .brand-panel {
        transform: translateX(0); opacity: 1;
        transition-delay: 0.1s;
      }

      /* Crosshair icon */
      .brand-icon { width: 64px; height: 64px; opacity: 0.8; margin-bottom: 16px; }

      .brand-divider {
        width: 70%; height: 2px;
        background: linear-gradient(90deg, transparent, #C89B3C, transparent);
        opacity: 0.5; margin: 16px 0;
      }

      .brand-title {
        font-size: 48px; font-weight: bold;
        letter-spacing: 3px; text-transform: uppercase;
        text-align: center; line-height: 0.95;
        color: #FFFFFF;
        text-shadow: 0 0 24px rgba(200,155,60,0.4);
      }
      .brand-title .gold { color: #C89B3C; }

      .brand-event {
        font-size: 14px; letter-spacing: 3px;
        color: #888; text-transform: uppercase;
        text-align: center; margin-top: 10px;
      }

      .brand-badge {
        margin-top: 20px;
        background: linear-gradient(90deg, #7A5C10, #C89B3C, #7A5C10);
        padding: 7px 20px;
        font-size: 14px; font-weight: bold;
        letter-spacing: 2px; color: #1A1A1A;
        text-transform: uppercase;
        clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        text-align: center;
        width: 100%; box-sizing: border-box;
      }

      /* ===== RIGHT: TABLE PANEL (800px) ===== */
      .table-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0A0A0A 0%, #0F0F0F 100%);
        transform: translateX(40px);
        opacity: 0;
        transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s ease;
        overflow: hidden;
      }
      #container.show .table-panel {
        transform: translateX(0); opacity: 1;
        transition-delay: 0.1s;
      }

      /* Gold top accent */
      .table-gold-top {
        height: 3px; flex-shrink: 0;
        background: linear-gradient(90deg, #7A5C10, #F0C040, #7A5C10);
      }

      /* Column header */
      .table-headers {
        display: grid;
        grid-template-columns: 52px 58px 1fr 68px 90px 94px;
        align-items: center;
        background: #151515;
        padding: 8px 14px;
        font-size: 13px; font-weight: bold;
        letter-spacing: 2px; color: #C89B3C;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(200,155,60,0.35);
        flex-shrink: 0;
      }
      .table-headers > div { text-align: center; }
      .table-headers > div:nth-child(3) { text-align: left; }

      /* Team list */
      .team-list {
        display: flex; flex-direction: column;
        flex: 1; overflow: hidden;
      }

      /* Base row */
      .team-row {
        display: grid;
        grid-template-columns: 52px 58px 1fr 68px 90px 94px;
        align-items: center;
        min-height: 48px;
        font-size: 19px; font-weight: bold;
        padding: 4px 14px;
        box-sizing: border-box;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }
      .team-row > div { text-align: center; }
      .team-row:nth-child(odd)  { background: rgba(28, 28, 28, 0.95); }
      .team-row:nth-child(even) { background: rgba(20, 20, 20, 0.9); }
      .team-row.match-start { border-top: 2px solid rgba(200,155,60,0.35); }

      /* Rank-1 highlight */
      .team-row.rank-first {
        background: linear-gradient(90deg, rgba(120,90,15,0.38) 0%, rgba(190,145,50,0.18) 50%, rgba(120,90,15,0.38) 100%);
        border-top: 1px solid rgba(200,155,60,0.55);
        border-bottom: 1px solid rgba(200,155,60,0.55);
        font-size: 22px;
      }
      .team-row.rank-first .c-rank { color: #F0C040; font-size: 24px; }
      .team-row.rank-first .c-total { color: #F0C040; }

      /* Cells */
      .c-match { color: #666; font-size: 14px; letter-spacing: 1px; }
      .c-rank  { color: #C89B3C; font-size: 19px; font-weight: bold; }
      .c-team  { display: flex; align-items: center; gap: 9px; text-align: left; overflow: hidden; }
      .team-logo { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
      .team-name-text {
        white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; text-transform: uppercase;
        letter-spacing: 0.5px; font-size: 18px;
      }
      .c-elims  { color: #F0C040; font-size: 19px; }
      .c-rpts   { color: #CCCCCC; }
      .c-total  { color: #FFFFFF; font-size: 21px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="content-area">

        <!-- LEFT: Branding -->
        <div class="brand-panel">
          <svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="29" stroke="#C89B3C" stroke-width="2.5"/>
            <circle cx="32" cy="32" r="10" stroke="#C89B3C" stroke-width="2"/>
            <line x1="32" y1="0"  x2="32" y2="19" stroke="#C89B3C" stroke-width="2.5"/>
            <line x1="32" y1="45" x2="32" y2="64" stroke="#C89B3C" stroke-width="2.5"/>
            <line x1="0"  y1="32" x2="19" y2="32" stroke="#C89B3C" stroke-width="2.5"/>
            <line x1="45" y1="32" x2="64" y2="32" stroke="#C89B3C" stroke-width="2.5"/>
          </svg>

          <div class="brand-title">MATCH<br/><span class="gold">RANKING</span></div>

          <div class="brand-divider"></div>

          <div class="brand-event">Piala Walikota</div>
          <div class="brand-event" style="color:#C89B3C; font-size:13px; letter-spacing:2px; margin-top:4px;">PUBG Mobile</div>

          <div class="brand-badge" id="f_match_badge">FINALS · MATCH 1</div>
        </div>

        <!-- RIGHT: Table -->
        <div class="table-panel">
          <div class="table-gold-top"></div>
          <div class="table-headers">
            <div>MATCH</div>
            <div>RANK</div>
            <div>TEAM</div>
            <div>ELIMS</div>
            <div>RANK PTS</div>
            <div>TOTAL PTS</div>
          </div>
          <div class="team-list" id="team-list"></div>
        </div>

      </div>
    </div>

    <script>
      const PLACEMENT_PTS = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1];
      function getPlacementPts(rank) {
        if (rank >= 1 && rank <= 10) return PLACEMENT_PTS[rank - 1];
        return 0;
      }
      function toNumber(value, fallback = 0) {
        const parsed = parseInt(value);
        return Number.isNaN(parsed) ? fallback : parsed;
      }
      function normalizeResult(row, fallbackMatch = 1) {
        const rank      = Math.max(1, toNumber(row.rank, 1));
        const kills     = Math.max(0, toNumber(row.kills, 0));
        const place_pts = row.place_pts !== undefined ? toNumber(row.place_pts, 0) : getPlacementPts(rank);
        const kill_pts  = row.kill_pts  !== undefined ? toNumber(row.kill_pts, kills) : kills;
        const total     = row.total     !== undefined ? toNumber(row.total, 0) : place_pts + kill_pts;
        return {
          ...row,
          match: Math.max(1, toNumber(row.match, fallbackMatch)),
          rank, kills,
          wwcd: Math.max(0, toNumber(row.wwcd, rank === 1 ? 1 : 0)),
          place_pts, kill_pts, total,
        };
      }

      function renderRows(rows) {
        const list = document.getElementById("team-list");
        list.innerHTML = "";
        let lastMatch = null;

        const sorted = rows
          .map(row => normalizeResult(row))
          .sort((a, b) => a.match - b.match || a.rank - b.rank);

        // Update badge
        if (sorted.length > 0) {
          const maxMatch = Math.max(...sorted.map(r => r.match));
          const badge = document.getElementById("f_match_badge");
          if (badge) badge.textContent = `FINALS · MATCH ${maxMatch}`;
        }

        sorted.forEach(team => {
          const isMatchStart = lastMatch !== null && lastMatch !== team.match;
          lastMatch = team.match;
          const isFirst = team.rank === 1;
          list.innerHTML += `
            <div class="team-row ${isMatchStart ? 'match-start' : ''} ${isFirst ? 'rank-first' : ''}">
              <div class="c-match">M${team.match}</div>
              <div class="c-rank">#${team.rank}</div>
              <div class="c-team">
                <img class="team-logo" src="team_logos/${team.id}.png" onerror="this.style.display='none'">
                <span class="team-name-text">${team.name}</span>
              </div>
              <div class="c-elims">${team.kills}</div>
              <div class="c-rpts">${team.place_pts}</div>
              <div class="c-total">${team.total}</div>
            </div>`;
        });
      }

      function renderCurrentMatch(teams) {
        const rows = [...teams]
          .filter(t => t.status !== "MISS")
          .map(team => normalizeResult({ ...team, match: 1 }))
          .sort((a, b) =>
            b.total - a.total || b.wwcd - a.wwcd ||
            b.kills - a.kills || a.rank - b.rank
          )
          .map((team, index) => ({ ...team, rank: index + 1 }));
        renderRows(rows);
      }

      function play() { document.getElementById("container").classList.add("show"); }

      function processState(state) {
        if (state && Array.isArray(state.postmatch) && state.postmatch.length) {
          renderRows(state.postmatch);
          return;
        }
        if (state && Array.isArray(state.teams) && state.teams.length) {
          renderCurrentMatch(state.teams);
        }
      }

      fetch("http://localhost:3000/api/state")
        .then(r => r.json())
        .then(state => processState(state))
        .catch(() => {
          // Fallback dummy data for preview
          const dummy = [];
          for (let i = 1; i <= 16; i++) {
            dummy.push({ match: 1, id: i, name: "TEAM " + i, kills: 16 - i, rank: i, wwcd: i === 1 ? 1 : 0 });
          }
          renderRows(dummy);
        });

      const evtSource = new EventSource("http://localhost:3000/api/stream");
      evtSource.onmessage = (event) => {
        try { processState(JSON.parse(event.data)); } catch(e) {}
      };

      setTimeout(() => play(), 500);
    </script>
  </body>
</html>
