<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match Ranking (Table Only)</title>
    <style>
      @font-face {
        font-family: "AgencyFB";
        src: url("fonts/agency_fb.ttf") format("truetype");
      }
      body, html {
        margin: 0; padding: 0;
        width: 1920px; height: 1080px;
        overflow: hidden;
        font-family: "AgencyFB", sans-serif;
        color: white;
        background: transparent;
      }

      #container {
        width: 960px; height: 1080px;
        position: absolute; top: 0; right: 0;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0A0A0A 0%, #0F0F0F 100%);
      }
      #container.show { opacity: 1; }

      /* ===== GOLD TOP ===== */
      .gold-top {
        height: 4px; flex-shrink: 0;
        background: linear-gradient(90deg, #6B5010, #F0C040 40%, #C89B3C 60%, #6B5010);
      }

      /* ===== TITLE BAR ===== */
      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px 10px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(200,155,60,0.35);
        /* Slide from right */
        opacity: 0; transform: translateX(30px);
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      #container.show .title-bar {
        opacity: 1; transform: translateX(0);
        transition-delay: 0.05s;
      }
      .title-text {
        font-size: 30px; font-weight: bold;
        letter-spacing: 5px; text-transform: uppercase;
        background: linear-gradient(180deg, #F5D56A 0%, #C89B3C 60%, #F0C868 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 1px 6px rgba(200,155,60,0.4));
      }
      .title-badge {
        background: linear-gradient(90deg, #7A5C10, #C89B3C, #7A5C10);
        padding: 5px 16px;
        font-size: 13px; font-weight: bold;
        letter-spacing: 2px; color: #1A1A1A;
        text-transform: uppercase;
        clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        white-space: nowrap;
      }

      /* ===== COLUMN HEADERS ===== */
      .table-headers {
        display: grid;
        grid-template-columns: 52px 56px 1fr 65px 92px 96px;
        align-items: center;
        background: #151515;
        padding: 7px 16px;
        font-size: 12px; font-weight: bold;
        letter-spacing: 2px; color: #C89B3C;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(200,155,60,0.3);
        flex-shrink: 0;
      }
      .table-headers > div { text-align: center; }
      .table-headers > div:nth-child(3) { text-align: left; padding-left: 4px; }

      /* ===== TEAM LIST ===== */
      .team-list {
        display: flex; flex-direction: column;
        flex: 1; overflow: hidden;
      }

      .team-row {
        display: grid;
        grid-template-columns: 52px 56px 1fr 65px 92px 96px;
        align-items: center;
        min-height: 50px;
        font-size: 18px; font-weight: bold;
        padding: 3px 16px;
        box-sizing: border-box;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        /* Slide from right */
        opacity: 0; transform: translateX(24px);
        transition: opacity 0.42s ease, transform 0.42s ease;
      }
      #container.show .team-row { opacity: 1; transform: translateX(0); }

      .team-row > div { text-align: center; }
      .team-row:nth-child(odd)  { background: rgba(26,26,26,0.95); }
      .team-row:nth-child(even) { background: rgba(18,18,18,0.9); }
      .team-row.match-start { border-top: 2px solid rgba(200,155,60,0.35); }

      /* Rank-1 highlight */
      .team-row.rank-first {
        background: linear-gradient(90deg, rgba(110,82,12,0.4) 0%, rgba(185,142,45,0.18) 50%, rgba(110,82,12,0.4) 100%);
        border-top: 1px solid rgba(200,155,60,0.55);
        border-bottom: 1px solid rgba(200,155,60,0.55);
        font-size: 21px;
      }
      .team-row.rank-first .c-rank { color: #F0C040; font-size: 23px; }
      .team-row.rank-first .c-total { color: #F0C040; }

      /* Cells */
      .c-match { color: #666; font-size: 13px; letter-spacing: 1px; }
      .c-rank  { color: #C89B3C; font-weight: bold; }
      .c-team  { display: flex; align-items: center; gap: 8px; text-align: left; overflow: hidden; }
      .team-logo { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
      .team-name-text {
        white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; text-transform: uppercase;
        letter-spacing: 0.5px; font-size: 17px;
      }
      .c-elims  { color: #F0C040; }
      .c-rpts   { color: #CCCCCC; font-size: 17px; }
      .c-total  { color: #FFFFFF; font-size: 20px; font-weight: bold; }

      /* ===== STAGGER (from right) ===== */
      .team-list .team-row:nth-child(1)  { transition-delay: 0.10s; }
      .team-list .team-row:nth-child(2)  { transition-delay: 0.14s; }
      .team-list .team-row:nth-child(3)  { transition-delay: 0.18s; }
      .team-list .team-row:nth-child(4)  { transition-delay: 0.22s; }
      .team-list .team-row:nth-child(5)  { transition-delay: 0.26s; }
      .team-list .team-row:nth-child(6)  { transition-delay: 0.30s; }
      .team-list .team-row:nth-child(7)  { transition-delay: 0.34s; }
      .team-list .team-row:nth-child(8)  { transition-delay: 0.38s; }
      .team-list .team-row:nth-child(9)  { transition-delay: 0.42s; }
      .team-list .team-row:nth-child(10) { transition-delay: 0.46s; }
      .team-list .team-row:nth-child(11) { transition-delay: 0.50s; }
      .team-list .team-row:nth-child(12) { transition-delay: 0.54s; }
      .team-list .team-row:nth-child(13) { transition-delay: 0.58s; }
      .team-list .team-row:nth-child(14) { transition-delay: 0.62s; }
      .team-list .team-row:nth-child(15) { transition-delay: 0.66s; }
      .team-list .team-row:nth-child(16) { transition-delay: 0.70s; }

      /* ===== GOLD BOTTOM ===== */
      .gold-bottom {
        height: 3px; flex-shrink: 0;
        background: linear-gradient(90deg, transparent, #C89B3C 30%, #F0C040 50%, #C89B3C 70%, transparent);
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="gold-top"></div>

      <div class="title-bar">
        <div class="title-text">Match Ranking</div>
        <div class="title-badge" id="f_match_badge">FINALS · MATCH 1</div>
      </div>

      <div class="table-headers">
        <div>MATCH</div>
        <div>RANK</div>
        <div>TEAM</div>
        <div>ELIMS</div>
        <div>RANK PTS</div>
        <div>TOTAL PTS</div>
      </div>

      <div class="team-list" id="team-list"></div>

      <div class="gold-bottom"></div>
    </div>

    <script>
      const PLACEMENT_PTS = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1];
      function getPlacementPts(rank) {
        if (rank >= 1 && rank <= 10) return PLACEMENT_PTS[rank - 1];
        return 0;
      }
      function toNumber(value, fallback = 0) {
        const parsed = parseInt(value);
        return Number.isNaN(parsed) ? fallback : parsed;
      }
      function normalizeResult(row, fallbackMatch = 1) {
        const rank      = Math.max(1, toNumber(row.rank, 1));
        const kills     = Math.max(0, toNumber(row.kills, 0));
        const place_pts = row.place_pts !== undefined ? toNumber(row.place_pts, 0) : getPlacementPts(rank);
        const kill_pts  = row.kill_pts  !== undefined ? toNumber(row.kill_pts, kills) : kills;
        const total     = row.total     !== undefined ? toNumber(row.total, 0) : place_pts + kill_pts;
        return {
          ...row,
          match: Math.max(1, toNumber(row.match, fallbackMatch)),
          rank, 
          kills: row.kill_pts !== undefined ? toNumber(row.kill_pts, 0) : 0,
          wwcd: Math.max(0, toNumber(row.wwcd, rank === 1 ? 1 : 0)),
          place_pts, kill_pts, total,
        };
      }

      function renderRows(rows) {
        const list = document.getElementById("team-list");
        if (!list) return;

        let lastMatch = null;

        const sorted = rows
          .map(row => normalizeResult(row))
          .sort((a, b) => a.match - b.match || a.rank - b.rank);

        if (sorted.length > 0) {
          const maxMatch = Math.max(...sorted.map(r => r.match));
          const badge = document.getElementById("f_match_badge");
          if (badge && badge.textContent !== `FINALS · MATCH ${maxMatch}`) {
            badge.textContent = `FINALS · MATCH ${maxMatch}`;
          }
        }

        while (list.children.length < sorted.length) {
          const div = document.createElement("div");
          div.className = "team-row";
          div.innerHTML = `
            <div class="c-match"></div>
            <div class="c-rank"></div>
            <div class="c-team">
              <img class="team-logo" src="" onerror="this.style.display='none'">
              <span class="team-name-text"></span>
            </div>
            <div class="c-elims"></div>
            <div class="c-rpts"></div>
            <div class="c-total"></div>
          `;
          list.appendChild(div);
        }
        while (list.children.length > sorted.length) {
          list.removeChild(list.lastChild);
        }

        sorted.forEach((team, i) => {
          const row = list.children[i];
          const isMatchStart = lastMatch !== null && lastMatch !== team.match;
          lastMatch = team.match;
          const isFirst = team.rank === 1;

          const newClass = `team-row ${isMatchStart ? 'match-start' : ''} ${isFirst ? 'rank-first' : ''}`;
          if (row.className !== newClass) row.className = newClass;

          function setCellText(idx, val) {
            const el = row.children[idx];
            if (el && el.textContent !== String(val)) el.textContent = val;
          }

          setCellText(0, `M${team.match}`);
          setCellText(1, `#${team.rank}`);

          const teamCell = row.children[2];
          const img = teamCell.querySelector('.team-logo');
          const imgSrc = `team_logos/${team.id}.png`;
          if (img && !img.src.endsWith(imgSrc)) img.src = imgSrc;

          const nameSpan = teamCell.querySelector('.team-name-text');
          if (nameSpan && nameSpan.textContent !== team.name) nameSpan.textContent = team.name;

          setCellText(3, team.kills); // ELIMS (menggunakan nilai kill_pts dari db)
          setCellText(4, team.place_pts);
          setCellText(5, team.total);
        });
      }

      function renderCurrentMatch(teams) {
        const rows = [...teams]
          .filter(t => t.status !== "MISS")
          .map(team => normalizeResult({ ...team, match: 1 }))
          .sort((a, b) => a.rank - b.rank);
        renderRows(rows);
      }

      function play() { document.getElementById("container").classList.add("show"); }

      function processState(state) {
        const urlParams = new URLSearchParams(window.location.search);
        const matchParam = urlParams.get('match') || "LIVE"; // LIVE is default

        let rowsToRender = [];

        if (matchParam.toUpperCase() === "LIVE") {
            rowsToRender = state.postmatch || [];
            console.log("[MATCH_RANKING] Loading LIVE data");
            console.log("[MATCH_RANKING] Rows:", rowsToRender.length);
            console.log("[MATCH_RANKING] Teams:", rowsToRender.length);
        } else {
            const selectedMatch = matchParam.match(/\d+/) ? matchParam.match(/\d+/)[0] : matchParam;
            if (state.match_history && Array.isArray(state.match_history)) {
                rowsToRender = state.match_history.filter(t => String(t.match) === String(selectedMatch));
            }
            console.log("[MATCH_HISTORY] Selected Match:", selectedMatch);
            console.log("[MATCH_HISTORY] Rows:", rowsToRender.length);
        }

        if (rowsToRender.length > 0) {
            renderRows(rowsToRender);
        } else {
            console.warn("No ranking data available");
        }
      }

// ==============================================================================
// INTEGRASI GOOGLE APPS SCRIPT BACKEND (AUTO-POLLING)
// ==============================================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwZ15aIzh3YXL2BC0BGEcnlikWG2T40WPVUPRHD_Vl3GtPUmPJvnU4ayrVSlokvs--l/exec";

let previousMatchState = [];
let isFetching = false;

function fetchFromGoogleSheets() {
    if (isFetching) return;
    isFetching = true;

    fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            let state = {};
            
            // 1. Deteksi jika halaman ini adalah OVERALL RANKING
            if (document.getElementById("f_overall_title")) {
                state.teams = data.overall_ranking;
                if(typeof processState === "function") processState(state);
            } 
            
            // 2. Deteksi jika halaman ini adalah ELIMINATED OVERLAY
            else if (document.querySelector(".eliminated-card")) {
                const currentMatch = data.match_ranking;
                
                // Deteksi tim yang baru saja "Mati" (Rata Lobi)
                if (previousMatchState.length > 0) {
                    currentMatch.forEach(team => {
                        const prevTeam = previousMatchState.find(p => p.name === team.name);
                        // Jika sebelumnya Alive (angkanya > 0) dan sekarang Alive menjadi 0
                        if (prevTeam && prevTeam.alive > 0 && team.alive === 0) {
                            state.eliminated_trigger = {
                                timestamp: Date.now(),
                                team_name: team.name,
                                team_id: team.id,
                                kills: team.kills,
                                rank: team.rank // Menangkap rank yang dikirim dari backend
                            };
                            if(typeof checkState === "function") checkState(state);
                        }
                    });
                }
                previousMatchState = currentMatch;
            } 
            
            // 3. Deteksi jika halaman ini adalah LIVE TICKER atau MATCH RANKING
            else {
                state.postmatch = data.postmatch;
                state.match_history = data.match_history;
                state.teams = data.match_ranking;
                if(typeof processState === "function") processState(state);
            }
            
            isFetching = false;
        })
        .catch(err => {
            console.error("Failed to load MATCH_RANKING:", err);
            isFetching = false;
        });
}

// Jalankan pengambilan data pertama kali saat halaman dimuat
fetchFromGoogleSheets();

// Lakukan Polling (Tarik Data) setiap 3 detik
setInterval(fetchFromGoogleSheets, 3000);

      setTimeout(() => play(), 500);
    </script>
  </body>
</html>
